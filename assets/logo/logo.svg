<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B2B" />
      <stop offset="100%" stop-color="#0F241A" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Roof / Arch Outline -->
    <path d="M28 62 L50 32 L72 62" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner Doorway / Arch -->
    <path d="M42 68 V50 Q50 42 58 50 V68" fill="none" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round"/>
    <!-- Chimney / Window Accent -->
    <circle cx="50" cy="38" r="3.5" fill="url(#goldGrad)" />
    <!-- Horizontal foundation line -->
    <line x1="22" y1="76" x2="78" y2="76" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text Brand -->
  <g transform="translate(132, 28)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#1B3B2B" letter-spacing="1.5">RUMAH KOST</text>
    <!-- Subtitle / Location -->
    <text x="2" y="58" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#7D9D8B" letter-spacing="3.5">KEBALEN • KEBAYORAN BARU</text>
    <!-- Tagline Badge -->
    <rect x="0" y="68" width="158" height="18" rx="4" fill="#F4EFEA"/>
    <text x="8" y="81" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#AA7C11" letter-spacing="1.2">EXECUTIVE RESIDENCE</text>
  </g>
</svg>